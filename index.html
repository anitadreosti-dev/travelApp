<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Travel Companion"><meta name="theme-color" content="#0E7C86"><title>My Travel Companion</title>
<style>
:root{--bg:#EEF2F3;--c:#fff;--ink:#14232B;--mu:#5B6B73;--ac:#0E7C86;--ac2:#D99A2B;--ln:#D7DFE2;--bad:#B3402F}
@media(prefers-color-scheme:dark){:root{--bg:#0F181C;--c:#18262C;--ink:#E8F0F2;--mu:#9DB0B8;--ac:#3FB8C4;--ac2:#E6B04F;--ln:#2A3B43;--bad:#E27B6A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0}
main{padding:12px 14px 110px;max-width:640px;margin:auto}h1{font-size:26px;margin:6px 0 10px}h2{font-size:19px;margin:18px 0 8px}
.card{background:var(--c);border-radius:14px;padding:14px;margin:0 0 10px;border:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.mu{color:var(--mu);font-size:14px}.r{text-align:right;font-weight:600;white-space:nowrap}
.hero{background:var(--ac);color:#fff;border:0}.hero .mu{color:#D8F2F4}.big{font-size:30px;font-weight:700}
button,.b{font:inherit;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-weight:600;margin:3px 3px 3px 0}
button.o{background:none;color:var(--ac)}button.d{background:none;color:var(--bad);border-color:var(--bad)}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--c);color:var(--ink);margin:3px 0 10px}
label{font-size:14px;color:var(--mu)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding:0 0 env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 0;font-size:11px;color:var(--mu);min-height:50px}nav a b{display:block;font-size:20px}nav a.on{color:var(--ac)}
#f{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 10px) 14px 60px;display:none;z-index:9}
.bar{height:8px;border-radius:4px;background:var(--ac);margin:3px 0 8px}.tr{background:var(--ln);border-radius:4px}.warn{border-left:4px solid var(--ac2)}.bad{color:var(--bad)}
.li{cursor:pointer}img.ph{max-width:100%;border-radius:10px}
</style></head><body><main id="m"></main><nav id="n"></nav><div id="f"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
let db={v:1,name:"My Travel Companion",cur:null,trips:[],expenses:[],bookings:[],items:[],places:[]},tab="home",q="",flt="",ph=null,fo=null;
const idb=new Promise((r,j)=>{const x=indexedDB.open("mtc",1);x.onupgradeneeded=()=>x.result.createObjectStore("kv");x.onsuccess=()=>r(x.result);x.onerror=j});
const kv=async(m,k,v)=>{const d=await idb;return new Promise((r,j)=>{const s=d.transaction("kv",m==="get"?"readonly":"readwrite").objectStore("kv"),x=m==="get"?s.get(k):m==="put"?s.put(v,k):s.delete(k);x.onsuccess=()=>r(x.result);x.onerror=j})};
const save=()=>kv("put","db",db),loc=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString(),today=()=>loc(new Date()).slice(0,10),addD=n=>loc(new Date(Date.now()+n*864e5)).slice(0,10);
const T=()=>db.trips.find(t=>t.id===db.cur)||db.trips.find(t=>!t.arch);
const money=(n,c)=>{try{return new Intl.NumberFormat("en-GB",{style:"currency",currency:(c||"GBP").toUpperCase()}).format(n)}catch{return(c||"")+" "+(+n||0).toFixed(2)}};
const conv=(e,t)=>(!e.cur||e.cur.toUpperCase()===t.cur.toUpperCase())?+e.amount:e.rate?e.amount*e.rate:null;
const C=["Accommodation","Flights","Trains","Local transport","Food","Drinks","Attractions","Shopping","Insurance","Miscellaneous"],BT=["Flight","Hotel","Train / bus","Car hire","Ferry","Transfer","Restaurant","Tour","Event","Other"],PC=["Attraction","Museum","Restaurant / café","Bar","Market","Shop","Park / beach","Viewpoint","Other"];
const SC={
trips:{n:"Trip",f:[["name","Trip name","text"],["dest","Destination","text"],["start","Start date","date"],["end","End date","date"],["cities","Countries / cities","text"],["cur","Home currency (e.g. GBP)","text"],["budget","Budget","number"],["with","Companions","text"],["notes","Notes and useful info","area"],["cover","Cover image","photo"]]},
expenses:{n:"Expense",f:[["trip","Trip","trip"],["amount","Amount","number"],["cur","Currency","text"],["rate","Rate to home currency (blank = unknown)","number"],["rt","Rate is","sel",["Estimated","Confirmed"]],["date","Date and time","datetime-local"],["cat","Category","sel",C],["desc","Description","text"],["merch","Merchant / location","text"],["city","City","text"],["pay","Payment method","text"],["st","Status","sel",["Paid","Refunded","Shared"]],["photo","Receipt photo","photo"],["notes","Notes","area"]]},
bookings:{n:"Booking",f:[["trip","Trip","trip"],["type","Type","sel",BT],["prov","Provider / business","text"],["ref","Booking reference","text"],["conf","Confirmation number","text"],["date","Date","date"],["time","Time","time"],["end","End date / arrival","text"],["addr","Address","text"],["phone","Phone","tel"],["link","Link","url"],["cost","Cost","number"],["cur","Currency","text"],["pay","Payment status","sel",["Unpaid","Deposit paid","Paid"]],["cancel","Cancellation deadline","date"],["st","Status","sel",["Pending","Confirmed","Completed","Cancelled"]],["how","Check-in / arrival instructions","area"],["notes","Notes","area"],["photo","Confirmation screenshot","photo"]]},
items:{n:"Itinerary item",f:[["trip","Trip","trip"],["date","Date","date"],["start","Start time","time"],["end","End time","time"],["title","Title","text"],["kind","Kind","sel",["Sightseeing","Transfer","Check-in / out","Restaurant","Tour","Shopping","Free time","Reminder"]],["loc","Location / address","text"],["notes","Notes","area"]]},
places:{n:"Place",f:[["trip","Trip (optional)","trip"],["name","Name","text"],["cat","Category","sel",PC],["city","City","text"],["addr","Address","text"],["link","Website","url"],["cost","Estimated cost","text"],["hours","Opening hours notes","text"],["pri","Priority","sel",["Medium","High","Low"]],["st","Status","sel",["Want to Visit","Planned","Visited","Favourite"]],["rate","My rating (1-5)","number"],["notes","Notes / experience","area"],["photo","Photo","photo"]]}};
const mapUrl=a=>"https://maps.apple.com/?q="+encodeURIComponent(a);
const LN={trips:t=>[t.name,[t.dest,t.start&&t.start+" → "+(t.end||"")].filter(Boolean).join(" · ")+(t.arch?" · Archived":""),""],
expenses:e=>{const t=db.trips.find(x=>x.id===e.trip)||{cur:"GBP"},c=conv(e,t);return[e.desc||e.cat,[(e.date||"").replace("T"," "),e.merch,e.st].filter(Boolean).join(" · "),money(e.amount,e.cur||t.cur)+(c==null?" ⚠ no rate":(e.cur&&e.cur!==t.cur?`<div class=mu>${e.rt==="Confirmed"?"":"~"}${money(c,t.cur)}</div>`:""))]},
bookings:b=>[(b.type||"")+": "+(b.prov||""),[b.date,b.time,b.ref&&"Ref "+b.ref,b.st].filter(Boolean).join(" · "),b.cost?money(b.cost,b.cur):""],
items:i=>[i.title,[i.date,i.start&&i.start+(i.end?"–"+i.end:""),i.loc].filter(Boolean).join(" · "),""],
places:p=>[p.name,[p.cat,p.city,p.st,p.rate&&"★"+p.rate].filter(Boolean).join(" · "),""]};
const srt={expenses:(a,b)=>(b.date||"").localeCompare(a.date||""),bookings:(a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")),items:(a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")),places:(a,b)=>(a.name||"").localeCompare(b.name||""),trips:(a,b)=>(b.start||"").localeCompare(a.start||"")};
function stats(t){const xs=db.expenses.filter(e=>e.trip===t.id&&e.st!=="Refunded");let o={tot:0,miss:0,est:0,cat:{},day:{},city:{}};for(const e of xs){const c=conv(e,t);if(c==null){o.miss++;continue}if(e.cur&&e.cur.toUpperCase()!==t.cur.toUpperCase()&&e.rt!=="Confirmed")o.est++;o.tot+=c;o.cat[e.cat]=(o.cat[e.cat]||0)+c;const d=(e.date||"").slice(0,10);o.day[d]=(o.day[d]||0)+c;const ci=e.city||"Unspecified";o.city[ci]=(o.city[ci]||0)+c}o.days=Object.keys(o.day).length;return o}
const bars=(o,t)=>{const m=Math.max(1,...Object.values(o));return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=row><span>${E(k||"–")}</span><span class=mu>${money(v,t.cur)}</span></div><div class=tr><div class=bar style="width:${v/m*100}%"></div></div>`).join("")||'<p class=mu>Nothing yet.</p>'};
const btn=(l,f,c="")=>`<button class="${c}" onclick="${f}">${l}</button>`;
function rowH(en,x){const[a,b,c]=LN[en](x);return`<div class="card li row" onclick="openForm('${en}','${x.id}')"><div><b>${E(a)}</b><div class=mu>${E(b)}</div></div><div class=r>${c}</div></div>`}
function listH(en){let xs=db[en].filter(x=>en==="trips"||(!T()||x.trip===T().id||(en==="places"&&!x.trip)));if(flt&&en==="places")xs=xs.filter(x=>x.st===flt);if(q)xs=xs.filter(x=>JSON.stringify(Object.values(x)).toLowerCase().includes(q.toLowerCase()));if(en==="expenses")xs=xs.sort(srt[en]);else xs=xs.sort(srt[en]);return xs.map(x=>rowH(en,x)).join("")||`<div class="card mu">No ${SC[en].n.toLowerCase()}s yet. Tap Add.</div>`}
const sb=(en)=>`<input type=search placeholder="Search" value="${E(q)}" oninput="q=this.value;$('#ls').innerHTML=listH('${en}')">`;
function timeline(t){const d={};for(const i of db.items.filter(x=>x.trip===t.id))(d[i.date||"Undated"]??=[]).push({...i,id:i.id,en:"items"});for(const b of db.bookings.filter(x=>x.trip===t.id&&x.date&&x.st!=="Cancelled"))(d[b.date]??=[]).push({id:b.id,en:"bookings",title:(b.type||"")+": "+(b.prov||""),start:b.time,loc:b.addr,ref:b.ref||b.conf});
return Object.keys(d).sort().map(k=>`<h2>${k}</h2>`+d[k].sort((a,b)=>(a.start||"").localeCompare(b.start||"")).map((x,i,a)=>{const ov=a.some((y,j)=>j!==i&&x.start&&y.start&&x.start<(y.end||y.start)&&y.start<(x.end||x.start)&&(x.end||y.end||x.start===y.start));return`<div class="card li warn-${ov?1:0} ${ov?"warn":""}" onclick="openForm('${x.en}','${x.id}')"><b>${E(x.start||"")} ${E(x.title)}</b><div class=mu>${E([x.loc,x.ref&&"Ref "+x.ref].filter(Boolean).join(" · "))}${ov?" · ⚠ overlaps":""}</div></div>`}).join("")).join("")||'<div class="card mu">No itinerary yet.</div>'}
function gs(v){const o=[];for(const en of Object.keys(SC))if(v)for(const x of db[en])if(JSON.stringify(Object.values(x)).toLowerCase().includes(v.toLowerCase()))o.push(`<span class=mu>${SC[en].n}</span>`+rowH(en,x));$("#sr").innerHTML=o.join("")}
function home(){const t=T();let h=`<h1>${E(db.name)}</h1><input type=search placeholder="Search everything" oninput="gs(this.value)"><div id=sr></div>`;if(!t)return h+`<div class=card><b>Welcome</b><p class=mu>Create your first trip, or load sample data to explore.</p>${btn("Add trip","openForm('trips')")}${btn("Load sample data","sample()","o")}</div>`+setH();
const s=stats(t),td=today(),dd=Math.ceil((new Date(t.start)-new Date(td))/864e5),rem=(t.budget||0)-s.tot,items=db.items.filter(i=>i.trip===t.id&&i.date===td).concat(db.bookings.filter(b=>b.trip===t.id&&b.date===td).map(b=>({id:b.id,en:"bookings",title:b.type+": "+b.prov,start:b.time,loc:b.addr}))).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
const al=db.bookings.filter(b=>b.trip===t.id&&b.st!=="Cancelled"&&b.st!=="Completed"&&((b.cancel&&b.cancel>=td&&b.cancel<=addD(7))||(b.date&&b.date>=td&&b.date<=addD(3))));
h+=`<div class="card hero"><div class=mu>${E(t.dest)} · ${E(t.start)} → ${E(t.end)}</div><div class=big>${E(t.name)}</div><div>${dd>0?dd+" days to go":t.end>=td?"Trip in progress":"Trip ended"}</div></div>
<div class=card><div class=row><span>Budget</span><b>${money(t.budget||0,t.cur)}</b></div><div class=row><span>Spent</span><b>${money(s.tot,t.cur)}</b></div><div class=row><span>Remaining</span><b class="${rem<0?"bad":""}">${money(rem,t.cur)}</b></div>${s.miss?`<p class="mu bad">${s.miss} expense(s) have no exchange rate and are not counted.</p>`:""}${s.est?`<p class=mu>~${s.est} total(s) use estimated rates.</p>`:""}<div class=mu>Places: ${db.places.filter(p=>p.trip===t.id).length} saved, ${db.places.filter(p=>p.trip===t.id&&p.st==="Visited").length} visited</div></div>
<div>${btn("+ Expense","openForm('expenses')")}${btn("+ Booking","openForm('bookings')")}${btn("+ Itinerary","openForm('items')")}${btn("+ Place","openForm('places')")}</div>
<h2>Alerts</h2>${al.map(b=>`<div class="card warn li" onclick="openForm('bookings','${b.id}')"><b>${E(b.type)}: ${E(b.prov)}</b><div class=mu>${b.cancel&&b.cancel>=td&&b.cancel<=addD(7)?"Cancel by "+b.cancel:b.date+" "+(b.time||"")}</div></div>`).join("")||'<div class="card mu">Nothing needs attention in the next few days.</div>'}
<h2>Today</h2>${items.map(x=>`<div class="card li" onclick="openForm('${x.en||"items"}','${x.id}')"><b>${E(x.start||"")} ${E(x.title)}</b><div class=mu>${E(x.loc||"")}</div></div>`).join("")||'<div class="card mu">Nothing planned today.</div>'}`;return h+setH()}
const setH=()=>`<h2>Settings and backup</h2><div class=card><label>App name</label><input value="${E(db.name)}" onchange="db.name=this.value;save();r()"><p class=mu>Last exported: ${localStorage.getItem("lastExp")||"never"}. Export regularly: iOS can clear web storage if the app is unused for a long time.</p>${btn("Export backup","exportJ()")}${btn("Restore backup","$('#rf').click()","o")}<input id=rf type=file accept=".json" hidden onchange="importJ(this.files[0])">${btn("Load sample data","sample()","o")}${btn("Remove sample data","unsample()","o")}</div>`;
function r(){const t=T();const sw=db.trips.length?`<select onchange="db.cur=this.value;save();r()">${db.trips.filter(x=>!x.arch||x.id===t?.id).map(x=>`<option value=${x.id} ${t&&x.id===t.id?"selected":""}>${E(x.name)}</option>`).join("")}</select>`:"";let h="";
if(tab==="home")h=home();
else if(tab==="trips")h=`<h1>Trips</h1>${btn("+ Add trip","openForm('trips')")}<div id=ls>${listH("trips")}</div>`+(t?`<h2>Itinerary: ${E(t.name)}</h2>${btn("+ Itinerary item","openForm('items')")}${timeline(t)}`:"");
else if(tab==="expenses"){h=`<h1>Expenses</h1>${sw}`;if(t){const s=stats(t),days=s.days||1;h+=`<div class=card><div class=row><span>Total</span><b>${money(s.tot,t.cur)}</b></div><div class=row><span>Budget remaining</span><b>${money((t.budget||0)-s.tot,t.cur)}</b></div><div class=row><span>Average per day</span><b>${money(s.tot/days,t.cur)}</b></div></div>${btn("+ Add expense","openForm('expenses')")}${btn("CSV","csv()","o")}${btn("Trip summary","summ()","o")}<h2>By category</h2><div class=card>${bars(s.cat,t)}</div><h2>By day</h2><div class=card>${bars(s.day,t)}</div><h2>By city</h2><div class=card>${bars(s.city,t)}</div><h2>Transactions</h2>${sb("expenses")}<div id=ls>${listH("expenses")}</div>`}else h+="<p>Add a trip first.</p>"}
else{const en=tab;h=`<h1>${tab==="places"?"Places":"Bookings"}</h1>${sw}${btn("+ Add","openForm('"+en+"')")}${sb(en)}${en==="places"?`<select onchange="flt=this.value;$('#ls').innerHTML=listH('places')"><option value="">All statuses</option>${["Want to Visit","Planned","Visited","Favourite"].map(s=>`<option ${flt===s?"selected":""}>${s}</option>`).join("")}</select>`:""}<div id=ls>${listH(en)}</div>`}
$("#m").innerHTML=h;$("#n").innerHTML=[["home","🏠","Home"],["trips","🧭","Trips"],["expenses","💷","Expenses"],["places","📍","Places"],["bookings","🎫","Bookings"]].map(([k,i,l])=>`<a href=# class="${tab===k?"on":""}" onclick="tab='${k}';q='';flt='';r();scrollTo(0,0);return false"><b>${i}</b>${l}</a>`).join("")}
async function openForm(en,id,pre){const s=SC[en],t=T();const o=id?db[en].find(x=>x.id===id):{...(en!=="trips"&&t?{trip:t.id}:{}),...(en==="expenses"?{cur:t?.cur,rt:"Estimated",st:"Paid",date:loc(new Date()).slice(0,16)}:{}),...(en==="trips"?{cur:"GBP"}:{}),...(en==="bookings"?{cur:t?.cur,st:"Pending",pay:"Unpaid"}:{}),...(en==="places"?{st:"Want to Visit",pri:"Medium"}:{}),...(en==="items"?{date:today()}:{}),...pre};fo={en,id,o};ph=null;
$("#f").innerHTML=`<h1>${id?"Edit":"New"} ${s.n.toLowerCase()}</h1>`+s.f.map(([k,l,ty,x])=>{const v=o[k]??"",i="f_"+k;if(ty==="area")return`<label>${l}</label><textarea id=${i} rows=3>${E(v)}</textarea>`;if(ty==="sel")return`<label>${l}</label><select id=${i}>${x.map(y=>`<option ${y===v?"selected":""}>${y}</option>`).join("")}</select>`;if(ty==="trip")return`<label>${l}</label><select id=${i}><option value="">None</option>${db.trips.map(y=>`<option value=${y.id} ${y.id===v?"selected":""}>${E(y.name)}</option>`).join("")}</select>`;if(ty==="photo")return`<label>${l}</label><img id=pv class=ph hidden><input id=${i} type=file accept="image/*" onchange="pick(this.files[0])">`;return`<label>${l}</label><input id=${i} type=${ty} ${ty==="number"?'step=any inputmode=decimal':""} value="${E(v)}">`}).join("")+
`<div>${btn("Save",`sv()`)}${btn("Cancel","closeF()","o")}${id?btn("Duplicate","dup()","o")+(en==="trips"?btn(o.arch?"Unarchive":"Archive","arch()","o"):"")+(en==="bookings"&&o.addr?`<a class=b href="${mapUrl(o.addr)}">Maps</a>`:"")+(en==="bookings"&&o.link?`<a class=b href="${E(o.link)}">Open link</a>`:"")+(en==="bookings"&&o.phone?`<a class=b href="tel:${E(o.phone)}">Call</a>`:"")+(en==="bookings"&&(o.ref||o.conf)?btn("Copy ref",`navigator.clipboard.writeText('${E(o.ref||o.conf)}')`,"o"):"")+(en==="places"?btn("Add to itinerary","toIt()","o"):"")+btn("Delete","del()","d"):""}</div>`;$("#f").style.display="block";$("#f").scrollTop=0;
if(o.photo){const d=await kv("get","p:"+o.photo);if(d){$("#pv").src=d;$("#pv").hidden=false}}}
const closeF=()=>{$("#f").style.display="none";fo=null};
function pick(f){if(!f)return;const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ph=c.toDataURL("image/jpeg",.7);$("#pv").src=ph;$("#pv").hidden=false;URL.revokeObjectURL(u)};im.src=u}
async function sv(){const{en,id}=fo,s=SC[en],o=id?fo.o:{id:uid()};for(const[k,,ty]of s.f){if(ty==="photo")continue;let v=$("#f_"+k).value;if(ty==="number")v=v===""?"":+v;o[k]=v}
const need={trips:["name"],expenses:["amount"],bookings:["prov"],items:["title"],places:["name"]}[en][0];if(o[need]===""||o[need]==null)return alert("Please fill in: "+s.f.find(f=>f[0]===need)[1]);
if(en==="trips"&&!o.cur)o.cur="GBP";if(en==="expenses"&&(!o.cur||o.cur.toUpperCase()===(db.trips.find(x=>x.id===o.trip)||{}).cur?.toUpperCase()))o.rate="";
if(ph){await kv("put","p:"+o.id,ph);o.photo=o.id}if(!id){db[en].push(o);if(en==="trips")db.cur=o.id}await save();closeF();r()}
async function dup(){const{en,o}=fo,n={...o,id:uid()};if(o.photo){n.photo=n.id;await kv("put","p:"+n.id,await kv("get","p:"+o.photo))}if(en==="trips")n.name+=" (copy)";db[en].push(n);await save();closeF();r()}
async function arch(){fo.o.arch=!fo.o.arch;if(fo.o.arch&&db.cur===fo.o.id)db.cur=null;await save();closeF();r()}
async function del(){const{en,o}=fo;if(!confirm(en==="trips"?"Delete this trip and ALL its expenses, bookings, itinerary and places? This cannot be undone.":"Delete this "+SC[en].n.toLowerCase()+"?"))return;if(en==="trips"){for(const k of["expenses","bookings","items","places"])db[k]=db[k].filter(x=>x.trip!==o.id);if(db.cur===o.id)db.cur=null}db[en]=db[en].filter(x=>x.id!==o.id);await kv("del","p:"+o.id);await save();closeF();r()}
